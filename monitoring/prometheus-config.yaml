# contracts 7.3
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: editor
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [default]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_number]
        regex: editor;8080
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: redis
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [default]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_number]
        regex: redis;9121
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
