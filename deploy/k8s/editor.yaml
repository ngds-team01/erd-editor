# contracts 7.4: HAProxy가 파드 목록을 찾는 headless Service
apiVersion: v1
kind: Service
metadata:
  name: editor-headless
  labels:
    app: editor
spec:
  clusterIP: None
  selector:
    app: editor
  ports:
    - name: http
      port: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: editor
  labels:
    app: editor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: editor
  template:
    metadata:
      labels:
        app: editor
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: editor
          image: crdt-server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REDIS_URL
              value: redis://redis-0.redis:6379
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_BUCKET
              value: erd-snapshots
            - name: AWS_REGION
              value: us-east-1
          envFrom:
            - secretRef:
                name: s3-credentials
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
          # 편집 서버는 Node 스레드 하나라, 문서 하나에 사람이 몰리면 바빠서 /healthz에 늦게 답할 수 있음
          # 바쁜 것뿐인데 재시작하면 모든 연결이 끊겨 한꺼번에 다시 붙으면서 더 바빠지므로, 약 1분(10초 × 6번) 응답이 없을 때만 재시작
          # (100명 부하 측정에서 3초 × 3번 설정으로 두 파드가 모두 재시작됨, #55)
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6